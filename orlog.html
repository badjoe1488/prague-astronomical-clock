<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orlog — Standard Map</title>
  <style>
    :root {
      --bg: #0b0c10;
      --ring: #c9a227;
      --ink: #e8e0c8;
      --sea: #1a3a4a;
      --land: #6b5a3a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.08em; }
    .sub { opacity: 0.7; font-size: 0.8rem; }
    main { display: grid; place-items: center; height: calc(100% - 52px); }
    canvas { max-width: min(92vw, 92vh); max-height: min(92vw, 92vh); }
  </style>
</head>
<body>
  <header>
    <h1>ORLOG</h1>
    <span class="sub">Standard map · Gleason / Orloj disc — published app source</span>
  </header>
  <main>
    <canvas id="map" width="900" height="900" aria-label="Azimuthal equidistant north-pole map"></canvas>
  </main>
  <script>
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, CX = W/2, CY = H/2, R = 400;

    function polar(latDeg, lonDeg) {
      const lat = latDeg * Math.PI / 180;
      const lon = lonDeg * Math.PI / 180;
      const r = R * (Math.PI/2 - lat) / Math.PI;
      return [CX + r * Math.sin(lon), CY - r * Math.cos(lon)];
    }

    function ring(r, color, width) {
      ctx.beginPath();
      ctx.arc(CX, CY, r, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function draw() {
      ctx.fillStyle = '#0b0c10';
      ctx.fillRect(0, 0, W, H);

      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.fillStyle = '#16303c';
      ctx.fill();

      for (let lat = 75; lat >= -15; lat -= 15) {
        const r = R * (90 - lat) / 180;
        ring(r, 'rgba(201,162,39,0.25)', 1);
      }
      for (let lon = 0; lon < 360; lon += 15) {
        const [x, y] = polar(-20, lon);
        ctx.beginPath();
        ctx.moveTo(CX, CY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = 'rgba(201,162,39,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      ring(R, '#c9a227', 6);
      ring(R + 18, '#8a7020', 2);

      const hours = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
      ctx.fillStyle = '#e8e0c8';
      ctx.font = '18px Georgia';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      hours.forEach((h, i) => {
        const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
        const rr = R + 38;
        ctx.fillText(h, CX + Math.cos(a) * rr, CY + Math.sin(a) * rr);
      });

      const now = new Date();
      const ang = ((now.getUTCHours() % 12) + now.getUTCMinutes()/60) / 12 * Math.PI * 2 - Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.lineTo(CX + Math.cos(ang) * (R - 20), CY + Math.sin(ang) * (R - 20));
      ctx.strokeStyle = '#e8c547';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(CX, CY, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#c9a227';
      ctx.fill();

      ctx.font = '13px Georgia';
      ctx.fillStyle = '#e8e0c8';
      ctx.fillText('N. POLE', CX, CY + 22);
    }

    draw();
    setInterval(draw, 30000);
  </script>
</body>
</html>
